{% extends "base.html" %}
{% block title %}Login | Farmer Guide AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🌾</span>
                    <h2 class="text-success fw-bold mt-2">Welcome Back</h2>
                    <p class="text-muted small">Log in with your registered account</p>
                </div>

                <!-- Alert Message Box -->
                <div id="authAlert" class="alert d-none" role="alert"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="farmer@example.com" required autocomplete="email">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                            <a href="/reset-password" class="text-success small text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-semibold">
                        <span id="btnText">Sign In</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <p class="text-muted small mb-0">
                        Don't have an account? 
                        <a href="/register" class="text-success fw-bold text-decoration-none">Create one here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const authAlert = document.getElementById("authAlert");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const togglePasswordIcon = document.getElementById("togglePasswordIcon");

    // Toggle password visibility
    togglePasswordBtn.addEventListener("click", function() {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePasswordIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
    });

    function showAlert(message, type = "danger") {
        authAlert.className = `alert alert-${type} alert-dismissible fade show`;
        authAlert.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
        authAlert.classList.remove("d-none");
    }

    function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
            btnText.textContent = "Signing In...";
            btnSpinner.classList.remove("d-none");
        } else {
            btnText.textContent = "Sign In";
            btnSpinner.classList.add("d-none");
        }
    }

    // Check URL parameters for redirect target or notifications
    const urlParams = new URLSearchParams(window.location.search);
    const nextUrl = urlParams.get("next") || "/dashboard";

    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        authAlert.classList.add("d-none");

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            showAlert("Please enter both email and password.");
            return;
        }

        setLoading(true);

        try {
            // 1. Authenticate with Firebase Auth SDK
            const userCredential = await FarmerAuth.auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // 2. Retrieve secure Firebase ID Token
            const idToken = await user.getIdToken();

            // 3. Establish verified server-side session
            const syncRes = await FarmerAuth.syncSessionWithBackend(idToken);

            if (syncRes.success) {
                showAlert("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.replace(syncRes.redirect || nextUrl);
                }, 400);
            } else {
                setLoading(false);
                showAlert(syncRes.error || "Failed to initialize application session.");
            }
        } catch (error) {
            setLoading(false);
            console.error("Firebase Login Error:", error.code, error.message);
            
            let userMsg = "Failed to sign in. Please check your credentials.";
            switch(error.code) {
                case "auth/invalid-credential":
                case "auth/wrong-password":
                case "auth/user-not-found":
                    userMsg = "Incorrect email or password. Please try again.";
                    break;
                case "auth/invalid-email":
                    userMsg = "The email address is improperly formatted.";
                    break;
                case "auth/user-disabled":
                    userMsg = "This user account has been disabled. Contact support.";
                    break;
                case "auth/too-many-requests":
                    userMsg = "Too many failed attempts. Please reset your password or try again later.";
                    break;
                case "auth/network-request-failed":
                    userMsg = "Network error. Please check your internet connection.";
                    break;
                default:
                    if (error.message) userMsg = error.message;
            }
            showAlert(userMsg);
        }
    });
});
</script>
{% endblock %}
