{% extends "base.html" %}
{% block title %}Reset Password | Farmer Guide AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🔑</span>
                    <h2 class="text-success fw-bold mt-2">Reset Password</h2>
                    <p class="text-muted small">Enter your email and we'll send you a secure link to reset your password.</p>
                </div>

                <div id="authAlert" class="alert d-none" role="alert"></div>

                <form id="resetForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="farmer@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-semibold">
                        <span id="btnText">Send Password Reset Link</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <p class="text-muted small mb-0">
                        Remembered your password? 
                        <a href="/login" class="text-success fw-bold text-decoration-none">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const authAlert = document.getElementById("authAlert");

    function showAlert(message, type = "danger") {
        authAlert.className = `alert alert-${type} alert-dismissible fade show`;
        authAlert.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
        authAlert.classList.remove("d-none");
    }

    function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
            btnText.textContent = "Sending...";
            btnSpinner.classList.remove("d-none");
        } else {
            btnText.textContent = "Send Password Reset Link";
            btnSpinner.classList.add("d-none");
        }
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        authAlert.classList.add("d-none");

        const email = emailInput.value.trim();
        if (!email) {
            showAlert("Please enter your registered email address.");
            return;
        }

        setLoading(true);

        try {
            await FarmerAuth.auth.sendPasswordResetEmail(email);
            setLoading(false);
            showAlert("Password reset link sent to your email! Please check your inbox and spam folder.", "success");
            emailInput.value = "";
        } catch (error) {
            setLoading(false);
            console.error("Firebase Password Reset Error:", error.code, error.message);

            let userMsg = "Failed to send reset link. Please check your email.";
            switch(error.code) {
                case "auth/user-not-found":
                    userMsg = "No account found with this email address.";
                    break;
                case "auth/invalid-email":
                    userMsg = "The email address is improperly formatted.";
                    break;
                default:
                    if (error.message) userMsg = error.message;
            }
            showAlert(userMsg);
        }
    });
});
</script>
{% endblock %}
